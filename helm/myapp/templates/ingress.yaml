{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: "{{ .Values.ingress.host }}"
      http:
        paths:
          - path: /thalapathy
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: 80

          - path: /darling
            pathType: Prefix
            backend:
              service:
                name: app2-service
                port:
                  number: 80
{{- end }}
