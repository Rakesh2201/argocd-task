apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-controller
  namespace: argocd
spec:
  project: default

  source:
    repoURL: ghcr.io/nginx/charts
    chart: nginx-ingress
    targetRevision: 2.8.0
    helm:
      releaseName: nginx-ingress
      valuesObject:
        controller:
          ingressClass:
            name: nginx
            create: true
          service:
            type: LoadBalancer

  destination:
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    syncOptions:
      - CreateNamespace=true